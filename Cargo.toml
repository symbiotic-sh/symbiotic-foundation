[workspace]
members = [
    "crates/symbiotic-core",
    "crates/symbiotic-queue",
    "crates/symbiotic-model",
    "crates/symbiotic-trace",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Symbiotic Contributors"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/symbiotic-ai/symbiotic-foundation"

[workspace.dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono", "serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "rt", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
