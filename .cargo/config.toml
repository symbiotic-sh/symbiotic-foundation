# Build settings shared by local builds and CI (operator 2026-10-05). Developer machines add opt-level 0
# in their own global Cargo config; CI keeps Cargo's default optimization.
[unstable]
trim-paths = true

[build]
# Parallel compiler front end; its threads take slots from Cargo's job pool.
rustflags = ["-Zthreads=8"]

# Workspace-relative source paths in compiler output (diagnostics, debug info, panic locations).
# Code that embeds a path itself, such as env!("CARGO_MANIFEST_DIR"), still records the checkout path.
[profile.dev]
trim-paths = "all"

[profile.release]
trim-paths = "all"
