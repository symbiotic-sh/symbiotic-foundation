[package]
name = "symbiotic-credential-process"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Credential-owning local model dispatch process"

[dependencies]
async-trait.workspace = true
base64 = "0.22"
libc = "0.2"
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
symbiotic-ai-runtime = { path = "../symbiotic-ai-runtime" }
symbiotic-egress = { path = "../symbiotic-egress" }
symbiotic-trace = { path = "../symbiotic-trace" }
tokio = { workspace = true, features = ["net", "io-util", "rt-multi-thread"] }
uuid.workspace = true
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[dev-dependencies]
rusqlite = { workspace = true, features = ["hooks"] }
tempfile = "3"
tracing.workspace = true
