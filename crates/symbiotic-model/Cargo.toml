[package]
name = "symbiotic-model"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Provider-neutral model runtime contracts"

[features]
default = ["queue"]
# The `Queued*` providers over a `symbiotic-queue` backend. Without it the crate
# is the provider contracts and HTTP providers, with no queue runtime.
queue = ["dep:symbiotic-queue"]

[dependencies]
async-trait.workspace = true
chrono.workspace = true
hex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
symbiotic-core = { path = "../symbiotic-core" }
symbiotic-queue = { path = "../symbiotic-queue", optional = true }
symbiotic-trace = { path = "../symbiotic-trace" }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Tests run the queued providers on the SQLite backend.
symbiotic-queue-sqlite = { path = "../symbiotic-queue-sqlite" }
futures = "0.3"
# Tests run with the `arbitrary_precision` serde_json feature that
# symbiotic-portability enables in workspace builds, so numeric parsing is
# checked the way consumers of the whole workspace see it.
serde_json = { workspace = true, features = ["arbitrary_precision"] }
tempfile = "3"
